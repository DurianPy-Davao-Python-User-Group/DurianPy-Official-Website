name: Production CD Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read
  pull-requests: read

jobs:
  deploy:
    name: Build & staging Deploy
    runs-on: ubuntu-latest
    environment: staging
    env:
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Enable pnpm
        run: |
          npm install -g corepack@0.31.0
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Get SSM Parameters for Deployment
        id: ssm-param
        uses: Armadillidiid/ssm-get-parameters-action@v1
        with:
          by-path: true
          secret: /durianpy/website-tanstack-start/staging/
          with-decryption: true
          mask-values: true
          recursive: true

      - name: Determine and Apply Version Bump
        id: version-bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bump-version.sh

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        env:
          NODE_ENV: 'production'
        run: pnpm run build

      - name: Deploy Assets to S3 and Invalidate CloudFront
        run: ./scripts/deploy-assets.sh
        env:
          S3_BUCKET: ${{ steps.ssm-param.outputs.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.ssm-param.outputs.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Fetch Lambda Layer URL
        id: layer-url
        run: |
          LAYER_URL=$(aws lambda get-layer-version-by-arn --arn arn:aws:lambda:ap-southeast-1:044395824272:layer:AWS-Parameters-and-Secrets-Lambda-Extension:61 --query 'Content.Location' --output text)
          echo "url=$LAYER_URL" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/durianpy-website-tanstack-start-${{ env.ENVIRONMENT }}
          build-args: |
            LAYER_URL=${{ steps.layer-url.outputs.url }}

      - name: Push Image
        if: success()
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/durianpy-website-tanstack-start-${{ env.ENVIRONMENT }}

      - name: Deploy to AWS Lambda
        if: success()
        run: |
          aws lambda update-function-code \
            --function-name durianpy-website-lambda-${{ env.ENVIRONMENT }} \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/durianpy-website-tanstack-start-${{ env.ENVIRONMENT }}
